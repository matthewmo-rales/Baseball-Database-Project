<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Baseball Analytics{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('main.index') }}">Baseball Analytics</a>
    <span class="tagline">MLB seasons 2015&ndash;2025</span>
  </header>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    Season data: FanGraphs. Player register: Chadwick Baseball Bureau.
  </footer>
</body>
</html>
